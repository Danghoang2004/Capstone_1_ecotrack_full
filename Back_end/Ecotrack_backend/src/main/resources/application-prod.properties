spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/ecotrack_demo1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-in-render}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Render will inject PORT automatically
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

logging.level.org.springframework.security=INFO
logging.level.capstone_1.Ecotrack_backend=INFO

# Mail settings
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.debug=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Google Login
google.client-id=${GOOGLE_CLIENT_ID:}

# AI service URL used by backend proxy
ai.classify-waste-url=${AI_CLASSIFY_WASTE_URL:http://127.0.0.1:8000/ai/classify-waste}

# WebSocket
spring.websocket.servlet.path=/ws
spring.websocket.endpoint=/ws/notifications