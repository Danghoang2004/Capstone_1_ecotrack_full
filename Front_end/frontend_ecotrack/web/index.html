<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend_ecotrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>frontend_ecotrack</title>
  <link rel="manifest" href="manifest.json">

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef4ef;
    }

    .goong-map-host,
    .goong-map-host .maplibregl-map {
      width: 100%;
      height: 100%;
    }

    .goong-map-host {
      display: block;
      overflow: hidden;
      position: absolute;
      inset: 0;
    }

    .goong-report-popup {
      max-height: 56vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 2px;
      width: min(84vw, 360px);
      max-width: 100%;
      box-sizing: border-box;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .goong-map-host .maplibregl-popup-content {
      max-width: min(88vw, 380px);
      box-sizing: border-box;
    }
  </style>

  <script>
    (function () {
      const state = {
        map: null,
        markers: [],
        popup: null,
        mode: 'reports',
        reports: [],
        heatPoints: [],
        heatPointsMode: null,
        ready: false,
        lastError: null,
        lastStage: 'boot',
        events: [],
        missingImageIds: new Set(),
        resizeObserver: null,
        resizeTimer: null,
        lastGoodContainerSize: { width: 0, height: 0 },
        recoveryAttempts: 0,
        reportLayersInitialized: false,
        clusterLayersInitialized: false,
      };

      function pushEvent(stage, detail) {
        const entry = {
          time: new Date().toISOString(),
          stage,
          detail: detail || '',
        };
        state.events.push(entry);
        if (state.events.length > 20) {
          state.events.shift();
        }
      }

      function logStage(stage, detail) {
        state.lastStage = stage;
        pushEvent(stage, detail);
        console.log(`[GoongMap][${stage}] ${detail || ''}`);
      }

      function logError(stage, detail, error) {
        state.lastStage = stage;
        state.lastError = detail;
        pushEvent(`error:${stage}`, detail);
        console.error(`[GoongMap][ERROR][${stage}] ${detail}`, error || '');
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function clearMarkers() {
        if (state.map) {
          if (state.map.getLayer('goong-reports-circle')) {
            state.map.removeLayer('goong-reports-circle');
          }
          if (state.map.getSource('goong-reports')) {
            state.map.removeSource('goong-reports');
          }
        }
        state.markers = [];
        state.reportLayersInitialized = false;
      }

      function clearHeat() {
        if (!state.map) return;
        const layerIds = ['goong-heat-outer', 'goong-heat-mid', 'goong-heat-core', 'goong-clusters-circle'];
        for (const layerId of layerIds) {
          if (state.map.getLayer(layerId)) {
            state.map.removeLayer(layerId);
          }
        }
        if (state.map.getSource('goong-heat')) {
          state.map.removeSource('goong-heat');
        }
        if (state.map.getSource('goong-clusters')) {
          state.map.removeSource('goong-clusters');
        }
        state.clusterLayersInitialized = false;
      }

      function clearPopup() {
        if (state.popup) {
          state.popup.remove();
          state.popup = null;
        }
      }

      function statusColor(status) {
        switch (String(status || '').toUpperCase()) {
          case 'PENDING':
            return '#f44336';
          case 'VERIFIED':
            return '#fb8c00';
          case 'CLEANED':
            return '#2e7d32';
          case 'REJECTED':
            return '#9ca3af';
          default:
            return '#3874c7';
        }
      }

      function scheduleMapResize(container) {
        if (!state.map || !container || !container.isConnected) {
          return;
        }

        if (state.resizeTimer) {
          window.clearTimeout(state.resizeTimer);
        }

        state.resizeTimer = window.setTimeout(() => {
          if (!state.map || !container || !container.isConnected) {
            return;
          }

          const width = container.clientWidth || 0;
          const height = container.clientHeight || 0;

          if (width > 0 && height > 0) {
            state.map.resize();
            logStage('resize', `container=${width}x${height}`);
          }
        }, 80);
      }

      function renderReports() {
        try {
          clearMarkers();
          clearHeat();
          clearPopup();

          if (!state.reports.length) {
            state.map.getSource('goong-reports') && state.map.removeSource('goong-reports');
            return;
          }

          const features = state.reports.map((item) => {
            const status = escapeHtml(item.status || 'UNKNOWN');
            const title = escapeHtml(item.title || 'Không có tiêu đề');
            const category = escapeHtml(item.category || 'Khác');
            const count = Number(item.count || 1);
            const overflowCount = Number(item.overflowCount || 0);
            const statusSummary = item.statusSummary || {};
            const pendingCount = Number(statusSummary.PENDING || 0);
            const verifiedCount = Number(statusSummary.VERIFIED || 0);
            const cleanedCount = Number(statusSummary.CLEANED || 0);
            const rejectedCount = Number(statusSummary.REJECTED || 0);

            // Build summary header
            let popupHtml = `
            <div class="goong-report-popup" style="font-family: Arial, sans-serif; line-height: 1.45;">
              <div style="font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #1f2937; overflow-wrap:anywhere;">${title}</div>
              <div style="font-size: 12px; color: #2563eb; margin-bottom: 4px; font-weight: 600;">Trạng thái cụm: ${status}</div>
              <div style="font-size: 12px; color: #374151; margin-bottom: 2px;">Loại rác: ${category}</div>
              <div style="font-size: 12px; color: #6b7280; margin-bottom: 8px;">Tổng báo cáo: ${count}</div>
              <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
                <span style="font-size:11px; padding:2px 8px; border-radius:999px; background:#fee2e2; color:#991b1b;">Chờ duyệt: ${pendingCount}</span>
                <span style="font-size:11px; padding:2px 8px; border-radius:999px; background:#ffedd5; color:#9a3412;">Đã xác thực: ${verifiedCount}</span>
                <span style="font-size:11px; padding:2px 8px; border-radius:999px; background:#dcfce7; color:#166534;">Đã dọn dẹp: ${cleanedCount}</span>
                <span style="font-size:11px; padding:2px 8px; border-radius:999px; background:#e5e7eb; color:#374151;">Bị từ chối: ${rejectedCount}</span>
              </div>`;

            // Add detailed list when cluster has multiple reports.
            if (item.reports && item.reports.length > 1) {
              popupHtml += `
              <div style="margin-top: 12px; border-top: 1px solid #e5e7eb; padding-top: 10px;">
                <div style="font-weight: 600; font-size: 12px; color: #1f2937; margin-bottom: 8px;">Chi tiết báo cáo:</div>`;

              popupHtml += `<div style="max-height: 160px; overflow-y: auto; padding-right: 4px;">`;

              for (let i = 0; i < item.reports.length; i++) {
                const r = item.reports[i];
                const rStatus = escapeHtml(r.status || 'UNKNOWN');
                const rTitle = escapeHtml(r.title || 'Không có tiêu đề');
                const rDesc = escapeHtml(r.description || '');

                popupHtml += `
                <div style="margin-bottom: 8px; padding: 6px; background: #f3f4f6; border-radius: 4px; border-left: 3px solid ${statusColor(rStatus)}; overflow-wrap:anywhere;">
                  <div style="font-weight: 600; font-size: 11px; color: #1f2937; overflow-wrap:anywhere;">${i + 1}. ${rTitle}</div>
                  <div style="font-size: 11px; color: #6b7280;">Trạng thái: <span style="color: ${statusColor(rStatus)}; font-weight: 600;">${rStatus}</span></div>
                  ${rDesc ? `<div style="font-size: 10px; color: #6b7280; margin-top: 2px;">Mô tả: ${rDesc}</div>` : ''}
                </div>`;
              }

              popupHtml += `</div>`;

              if (overflowCount > 0) {
                popupHtml += `<div style="font-size: 11px; color: #4b5563; margin-top: 4px; font-style: italic;">Còn ${overflowCount} báo cáo khác. Vui lòng zoom-in để xem chi tiết hơn.</div>`;
              }

              popupHtml += `</div>`;
            }

            popupHtml += `</div>`;

            return {
              type: 'Feature',
              geometry: {
                type: 'Point',
                coordinates: [Number(item.longitude), Number(item.latitude)],
              },
              properties: {
                reportId: item.reportId || '',
                title: item.title || 'Không có tiêu đề',
                description: item.description || '',
                status: item.status || 'UNKNOWN',
                category: item.category || 'Khác',
                count,
                popupHtml,
              },
            };
          });

          const reportsData = {
            type: 'FeatureCollection',
            features,
          };

          const existingSource = state.map.getSource('goong-reports');
          if (existingSource && typeof existingSource.setData === 'function') {
            existingSource.setData(reportsData);
          } else {
            if (state.map.getLayer('goong-reports-circle')) {
              state.map.removeLayer('goong-reports-circle');
            }
            if (state.map.getSource('goong-reports')) {
              state.map.removeSource('goong-reports');
            }

            state.map.addSource('goong-reports', {
              type: 'geojson',
              data: reportsData,
            });

            if (!state.reportLayersInitialized) {
              state.reportLayersInitialized = true;

              state.map.on('click', 'goong-reports-circle', (event) => {
                if (!event.features || event.features.length === 0) {
                  return;
                }

                const feature = event.features[0];
                const properties = feature.properties || {};

                clearPopup();
                state.popup = new maplibregl.Popup({
                  offset: 18,
                  closeButton: true,
                  closeOnClick: true,
                  anchor: 'center',
                  maxWidth: '420px',
                })
                  .setLngLat(feature.geometry.coordinates)
                  .setHTML(properties.popupHtml || 'Không có dữ liệu')
                  .addTo(state.map);
              });

              state.map.on('mouseenter', 'goong-reports-circle', () => {
                state.map.getCanvas().style.cursor = 'pointer';
              });

              state.map.on('mouseleave', 'goong-reports-circle', () => {
                state.map.getCanvas().style.cursor = '';
              });

              logStage('renderReports', 'initialized event handlers for report layer');
            }
          }

          if (!state.map.getLayer('goong-reports-circle')) {
            state.map.addLayer({
              id: 'goong-reports-circle',
              type: 'circle',
              source: 'goong-reports',
              paint: {
                'circle-color': [
                  'match',
                  ['upcase', ['coalesce', ['get', 'status'], 'UNKNOWN']],
                  'PENDING', '#f44336',
                  'VERIFIED', '#fb8c00',
                  'CLEANED', '#2e7d32',
                  'REJECTED', '#9ca3af',
                  '#3874c7',
                ],
                'circle-radius': [
                  'interpolate',
                  ['linear'],
                  ['coalesce', ['get', 'count'], 1],
                  1, 9,
                  3, 12,
                  10, 16,
                ],
                'circle-opacity': 0.92,
                'circle-stroke-width': 2,
                'circle-stroke-color': '#ffffff',
              },
            });
          }

          state.map.setLayoutProperty('goong-reports-circle', 'visibility', 'visible');

          logStage('renderReports', `rendered ${features.length} report clusters as circle layer`);
        } catch (error) {
          logError('renderReports', 'Failed to render report clusters', error);
        }
      }

      function renderClusters() {
        try {
          clearMarkers();
          clearPopup();

          if (!state.heatPoints.length) {
            clearHeat();
            logStage('renderClusters', 'no heat points, clearing layers');
            return;
          }

          logStage('renderClusters', `rendering ${state.heatPoints.length} heat points in mode=${state.mode}`);

          const rankedPoints = state.heatPoints
            .map((cluster, index) => ({
              index,
              count: Number(cluster.count || cluster.reportCount || cluster.predictedCount7d || 0),
              intensity: Number(cluster.intensity || 0),
            }))
            .sort((a, b) => {
              if (b.count !== a.count) return b.count - a.count;
              return b.intensity - a.intensity;
            });

          const rankTierByIndex = new Map();
          const totalPoints = rankedPoints.length;
          rankedPoints.forEach((item, rank) => {
            // Split by rank so admins can visually distinguish low/medium/high clearly.
            const percentile = (rank + 1) / Math.max(totalPoints, 1);
            let tier = 'low';
            if (percentile <= 1 / 3) tier = 'high';
            else if (percentile <= 2 / 3) tier = 'medium';
            rankTierByIndex.set(item.index, tier);
          });

          const features = state.heatPoints.map((cluster, index) => {
            const count = Number(cluster.count || cluster.reportCount || cluster.predictedCount7d || 0);
            const intensity = Number(cluster.intensity || 0);

            const tier = totalPoints >= 3
              ? rankTierByIndex.get(index)
              : (intensity >= 0.67 ? 'high' : intensity >= 0.33 ? 'medium' : 'low');

            let clusterColor = '#f59e0b';
            if (state.mode === 'heat_predicted') {
              if (tier === 'high') clusterColor = '#ef4444';
              else if (tier === 'medium') clusterColor = '#8b5cf6';
              else clusterColor = '#06b6d4';
            } else {
              if (tier === 'high') clusterColor = '#ef4444';
              else if (tier === 'medium') clusterColor = '#f59e0b';
              else clusterColor = '#22c55e';
            }

            return {
              type: 'Feature',
              geometry: {
                type: 'Point',
                coordinates: [Number(cluster.lng), Number(cluster.lat)],
              },
              properties: {
                clusterId: cluster.clusterId || 0,
                count: count,
                intensity: intensity,
                color: clusterColor,
                label: String(count),
              },
            };
          });

          const clusterData = {
            type: 'FeatureCollection',
            features,
          };

          const existingSource = state.map.getSource('goong-clusters');
          if (existingSource && typeof existingSource.setData === 'function') {
            existingSource.setData(clusterData);
          } else {
            clearHeat();
            state.map.addSource('goong-clusters', {
              type: 'geojson',
              data: clusterData,
            });
          }

          if (!state.map.getLayer('goong-clusters-circle')) {
            state.map.addLayer({
              id: 'goong-clusters-circle',
              type: 'circle',
              source: 'goong-clusters',
              paint: {
                'circle-color': ['get', 'color'],
                'circle-radius': ['interpolate', ['linear'], ['get', 'intensity'], 0, 16, 1, 32],
                'circle-opacity': 0.72,
                'circle-stroke-width': 2,
                'circle-stroke-color': '#ffffff',
                'circle-stroke-opacity': 0.9,
              },
            });
            logStage('renderClusters', 'created goong-clusters-circle layer');
          }

          // Ensure visibility is set every time we render
          state.map.setLayoutProperty('goong-clusters-circle', 'visibility', 'visible');

          if (!state.clusterLayersInitialized) {
            state.clusterLayersInitialized = true;

            state.map.on('click', 'goong-clusters-circle', (event) => {
              if (!event.features || event.features.length === 0) return;
              const feature = event.features[0];
              const props = feature.properties || {};

              clearPopup();
              state.popup = new maplibregl.Popup({
                offset: 18,
                closeButton: true,
                closeOnClick: true,
                maxWidth: '380px',
              })
                .setLngLat(feature.geometry.coordinates)
                .setHTML(`
                <div style="padding: 10px; font-family: Arial, sans-serif;">
                  <div style="font-weight: 700; font-size: 14px; color: #1f2937; margin-bottom: 6px;">
                    ${state.mode === 'heat_predicted' ? 'Vùng Dự Báo' : 'Vùng Hotspot'}
                  </div>
                  <div style="font-size: 12px; color: #6b7280;">
                    ${state.mode === 'heat_predicted' ? 'Dự báo báo cáo 7 ngày' : 'Tổng số báo cáo'}: <strong>${props.count}</strong>
                  </div>
                  <div style="font-size: 12px; color: #6b7280; margin-top: 4px;">
                    Mức độ rủi ro: ${(Number(props.intensity) * 100).toFixed(0)}%
                  </div>
                  <div style="margin-top: 8px; font-size: 11px; color: #9ca3af; font-style: italic;">
                    Nhấn để xem chi tiết hoặc thu phóng để xem báo cáo riêng
                  </div>
                </div>
              `)
                .addTo(state.map);
            });

            state.map.on('mouseenter', 'goong-clusters-circle', () => {
              state.map.getCanvas().style.cursor = 'pointer';
            });

            state.map.on('mouseleave', 'goong-clusters-circle', () => {
              state.map.getCanvas().style.cursor = '';
            });

            logStage('renderClusters', 'initialized event handlers for cluster layer');
          }

          state.map.setLayoutProperty('goong-clusters-circle', 'visibility', 'visible');
          logStage('renderClusters', `✓ rendered ${features.length} clusters with intensity-based coloring (mode=${state.mode})`);
        } catch (error) {
          logError('renderClusters', 'Failed to render hotspot clusters', error);
        }
      }

      function render() {
        try {
          if (!state.map || !state.map.isStyleLoaded()) {
            return;
          }

          if (!state.ready) {
            state.ready = true;
            state.lastError = null;
          }

          logStage('render', `rendering mode=${state.mode} with ${state.reports?.length || 0} reports and ${state.heatPoints?.length || 0} heatPoints`);

          if (state.mode === 'reports') {
            // Mode: Reports - show report markers, hide clusters
            renderReports();
            // Hide cluster layers if they exist
            if (state.map.getLayer('goong-clusters-circle')) {
              state.map.setLayoutProperty('goong-clusters-circle', 'visibility', 'none');
            }
            logStage('render', 'showing report clusters, hiding heat clusters');
          } else {
            // Mode: Heat (observed or predicted) - show clusters, hide reports
            renderClusters();
            // Hide report layer if it exists
            if (state.map.getLayer('goong-reports-circle')) {
              state.map.setLayoutProperty('goong-reports-circle', 'visibility', 'none');
            }
            logStage('render', 'showing heat clusters, hiding report clusters');
          }
        } catch (error) {
          logError('render', 'Unexpected render failure', error);
        }
      }

      function installMissingImageFallback(map) {
        map.on('styleimagemissing', (event) => {
          const id = event && event.id ? event.id : null;
          if (id) {
            if (state.missingImageIds.has(id) || map.hasImage(id)) {
              return;
            }

            state.missingImageIds.add(id);
            logStage('styleimagemissing', id);

            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');

            if (!context) {
              logError('styleimagemissing', `Missing Goong sprite image: ${id} (no canvas context)`);
              return;
            }

            context.clearRect(0, 0, size, size);
            context.beginPath();
            context.arc(size / 2, size / 2, 5, 0, Math.PI * 2);
            context.fillStyle = '#2563eb';
            context.fill();
            context.lineWidth = 2;
            context.strokeStyle = '#ffffff';
            context.stroke();

            const imageData = context.getImageData(0, 0, size, size);

            try {
              map.addImage(id, imageData);
              logStage('styleimagemissing', `blue-circle fallback injected for ${id}`);
            } catch (error) {
              logError('styleimagemissing', `failed to inject fallback for ${id}`, error);
            }
          }
        });
      }

      function suppressSpriteHeavyLayers(map) {
        if (!map || !map.getStyle || !map.getStyle().layers) {
          return;
        }

        const symbolLayers = [];
        for (const layer of map.getStyle().layers) {
          const layout = layer.layout || {};
          const usesIconImage = Object.prototype.hasOwnProperty.call(layout, 'icon-image');
          if (layer.type === 'symbol' && usesIconImage) {
            symbolLayers.push(layer.id);
          }
        }

        if (symbolLayers.length > 0) {
          logStage('suppress-layers', `detected ${symbolLayers.length} symbol layers: ${symbolLayers.slice(0, 12).join(', ')}`);
        } else {
          logStage('suppress-layers', 'no sprite-heavy symbol layers found');
        }
      }

      function installResizeObserver(container) {
        if (state.resizeObserver) {
          state.resizeObserver.disconnect();
          state.resizeObserver = null;
        }

        if (typeof ResizeObserver === 'undefined') {
          return;
        }

        let lastWidth = 0;
        let lastHeight = 0;

        state.resizeObserver = new ResizeObserver(() => {
          const width = container.clientWidth || 0;
          const height = container.clientHeight || 0;

          if (width > 0 && height > 0 && (width !== lastWidth || height !== lastHeight)) {
            lastWidth = width;
            lastHeight = height;
            scheduleMapResize(container);
          }
        });
        state.resizeObserver.observe(container);
      }

      function findContainerDeep(containerId) {
        const queue = [document];

        while (queue.length > 0) {
          const root = queue.shift();
          if (!root) continue;

          if (root.getElementById) {
            const byId = root.getElementById(containerId);
            if (byId) return byId;
          }

          const nodes = root.querySelectorAll ? root.querySelectorAll('*') : [];
          for (const node of nodes) {
            if (node.id === containerId) {
              return node;
            }
            if (node.shadowRoot) {
              queue.push(node.shadowRoot);
            }
          }
        }

        return null;
      }

      window.goongAdminMapInit = function (containerOrId, styleUrl, lng, lat, zoom) {
        logStage('init', 'called');
        if (state.map) {
          state.map.remove();
          state.map = null;
        }
        if (state.resizeObserver) {
          state.resizeObserver.disconnect();
          state.resizeObserver = null;
        }
        if (state.resizeTimer) {
          window.clearTimeout(state.resizeTimer);
          state.resizeTimer = null;
        }
        state.ready = false;
        state.lastError = null;

        let container = null;
        if (typeof containerOrId === 'string') {
          container = findContainerDeep(containerOrId);
        } else if (containerOrId instanceof HTMLElement) {
          container = containerOrId;
        } else if (containerOrId && typeof containerOrId.id === 'string') {
          container = findContainerDeep(containerOrId.id);
        }

        if (!container) {
          logError('init', 'Container not found', containerOrId);
          return;
        }

        if (!container.isConnected) {
          logError('init', 'Container not connected to DOM', container);
          return;
        }

        if (container.clientWidth <= 0 || container.clientHeight <= 0) {
          logError('init', `Container has invalid size ${container.clientWidth}x${container.clientHeight}`, container);
          return;
        }

        logStage('init', `container=${container.clientWidth}x${container.clientHeight} styleUrl=${styleUrl}`);

        window.requestAnimationFrame(() => {
          window.setTimeout(() => {
            try {
              if (!container.isConnected) {
                logError('init', 'Container detached before creating MapLibre map', container);
                return;
              }

              if (container.clientWidth <= 0 || container.clientHeight <= 0) {
                logError('init', `Container collapsed before creating map: ${container.clientWidth}x${container.clientHeight}`, container);
                return;
              }

              logStage('init', 'creating MapLibre map');

              // Ensure lng and lat are valid numbers
              const validLng = Number(lng);
              const validLat = Number(lat);
              const validZoom = Number(zoom);

              if (isNaN(validLng) || isNaN(validLat) || isNaN(validZoom)) {
                throw new Error(`Invalid map parameters: lng=${lng} (${validLng}), lat=${lat} (${validLat}), zoom=${zoom} (${validZoom})`);
              }

              state.map = new maplibregl.Map({
                container,
                style: styleUrl,
                center: [validLng, validLat],
                zoom: validZoom,
              });

              installMissingImageFallback(state.map);
              installResizeObserver(container);
              // Disabled Goong NavigationControl to avoid UI overlap with admin zoom buttons
              // state.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
              state.map.on('load', () => {
                state.ready = true;
                state.lastError = null;
                logStage('load', 'map load event fired');
                suppressSpriteHeavyLayers(state.map);
                scheduleMapResize(container);
                render();
              });
              state.map.on('idle', () => {
                if (state.map && state.map.isStyleLoaded()) {
                  state.ready = true;
                  state.lastError = null;

                  const canvas = state.map.getCanvas();
                  const cw = container.clientWidth || 0;
                  const ch = container.clientHeight || 0;

                  // Track good container sizes for collapse detection
                  if (cw > 0 && ch > 0) {
                    state.lastGoodContainerSize = { width: cw, height: ch };
                    state.recoveryAttempts = 0;
                  }

                  if (canvas) {
                    const computed = window.getComputedStyle(canvas);
                    const rect = canvas.getBoundingClientRect();
                    const visible =
                      rect.width > 0 &&
                      rect.height > 0 &&
                      computed.visibility !== 'hidden' &&
                      computed.display !== 'none';

                    logStage(
                      'idle',
                      `container=${cw}x${ch}, canvas=${Math.round(rect.width)}x${Math.round(rect.height)}, visible=${visible}`
                    );

                    if (computed.backgroundColor === 'rgba(0, 0, 0, 0)' || !computed.backgroundColor) {
                      canvas.style.backgroundColor = '#ffffff';
                    }

                    // Only attempt recovery if:
                    // 1. Container has good size (> 0)
                    // 2. Canvas is 0x0 (needs resize)
                    // 3. We haven't exceeded recovery attempts
                    if (cw > 0 && ch > 0 && rect.width === 0 && rect.height === 0 && state.recoveryAttempts < 1) {
                      state.recoveryAttempts += 1;
                      window.setTimeout(() => {
                        if (state.map && container.isConnected) {
                          const w = container.clientWidth || 0;
                          const h = container.clientHeight || 0;
                          if (w > 0 && h > 0) {
                            state.map.resize();
                            logStage('recover', `forced resize (attempt ${state.recoveryAttempts}) because canvas was 0x0 while container=${w}x${h}`);
                          }
                        }
                      }, 120);
                    }
                  } else {
                    logStage('idle', 'style loaded and map idle (NO CANVAS FOUND)');
                  }
                }
              });
              state.map.on('error', (event) => {
                const msg = event && event.error && event.error.message ? event.error.message : 'Unknown map error';
                logError('map-error', msg, event);
              });
              state.map.on('data', (event) => {
                if (event && event.sourceId) {
                  if (event.isSourceLoaded) {
                    logStage('data', `source '${event.sourceId}' loaded`);
                  }
                }
              });
              state.map.on('styledata', () => {
                if (state.map && state.map.isStyleLoaded()) {
                  state.ready = true;
                  state.lastError = null;
                  logStage('styledata', 'style is loaded');
                  suppressSpriteHeavyLayers(state.map);
                }
              });
              state.map.on('click', clearPopup);

              scheduleMapResize(container);
            } catch (e) {
              logError('init', String(e), e);
            }
          }, 0);
        });
      };

      window.goongAdminMapIsReady = function () {
        return !!state.ready;
      };

      window.goongAdminMapLastError = function () {
        return state.lastError;
      };

      window.goongAdminMapDiagnostics = function () {
        let canvasInfo = { found: false, visible: false, width: 0, height: 0 };
        let styleInfo = { loaded: false, layers: 0, sources: 0 };

        if (state.map) {
          const canvas = state.map.getCanvas();
          if (canvas) {
            const rect = canvas.getBoundingClientRect();
            const computed = window.getComputedStyle(canvas);
            canvasInfo = {
              found: true,
              visible: rect.width > 0 && rect.height > 0 && computed.display !== 'none' && computed.visibility !== 'hidden',
              width: Math.round(rect.width),
              height: Math.round(rect.height),
              opacity: computed.opacity,
              zIndex: computed.zIndex,
            };
          }

          if (state.map.isStyleLoaded && state.map.getStyle) {
            const style = state.map.getStyle();
            styleInfo = {
              loaded: state.map.isStyleLoaded(),
              layers: style && style.layers ? style.layers.length : 0,
              sources: style && style.sources ? Object.keys(style.sources).length : 0,
            };
          }
        }

        return JSON.stringify({
          ready: state.ready,
          lastStage: state.lastStage,
          lastError: state.lastError,
          map: state.map ? 'exists' : 'null',
          canvas: canvasInfo,
          style: styleInfo,
          recentEvents: state.events.slice(-10),
        });
      };

      window.goongAdminMapSetMode = function (mode) {
        try {
          logStage('setMode', `changing mode from '${state.mode}' to '${mode}'`);
          state.mode = mode;
          const hasRenderableData =
            (mode === 'reports' && state.reports.length > 0) ||
            (mode !== 'reports' && state.heatPoints.length > 0 && state.heatPointsMode === mode);

          if (hasRenderableData) {
            render();
            logStage('setMode', `✓ mode set to '${state.mode}', render() called`);
          } else {
            logStage('setMode', `✓ mode set to '${state.mode}', waiting for matching dataset before render`);
          }
        } catch (error) {
          logError('setMode', `Failed to switch mode to ${mode}`, error);
        }
      };

      window.goongAdminMapSetReports = function (json) {
        try {
          state.reports = JSON.parse(json || '[]');
          render();
        } catch (error) {
          state.reports = [];
          logError('setReports', 'Failed to parse or render report clusters', error);
        }
      };

      window.goongAdminMapSetHeatPoints = function (json) {
        try {
          const parsed = JSON.parse(json || '[]');
          logStage('setHeatPoints', `received JSON length=${(json || '').length}, parsed ${parsed.length} points`);

          if (parsed.length === 0) {
            state.heatPointsMode = null;
            logStage('setHeatPoints', 'empty heatPoints array, clearing render');
          } else {
            const predicted = parsed[0]?.predicted === true;
            state.heatPointsMode = predicted ? 'heat_predicted' : 'heat_observed';
            logStage('setHeatPoints', `first point: lat=${parsed[0]?.lat}, lng=${parsed[0]?.lng}, intensity=${parsed[0]?.intensity}, count=${parsed[0]?.count}, dataMode=${state.heatPointsMode}`);
          }

          state.heatPoints = parsed;
          if (state.mode === 'reports' || state.heatPointsMode === state.mode || parsed.length === 0) {
            render();
          } else {
            logStage('setHeatPoints', `data ready for ${state.heatPointsMode}, current mode=${state.mode}, skip render until mode matches`);
          }
        } catch (error) {
          state.heatPoints = [];
          state.heatPointsMode = null;
          logError('setHeatPoints', 'Failed to parse or render hotspot clusters', error);
          logStage('setHeatPoints', `Raw JSON received (first 200 chars): ${(json || '').substring(0, 200)}`);
        }
      };

      window.goongAdminMapZoomIn = function () {
        if (state.map) {
          state.map.zoomIn();
        }
      };

      window.goongAdminMapZoomOut = function () {
        if (state.map) {
          state.map.zoomOut();
        }
      };

      window.goongAdminMapDispose = function () {
        clearMarkers();
        clearHeat();
        clearPopup();
        if (state.resizeObserver) {
          state.resizeObserver.disconnect();
          state.resizeObserver = null;
        }
        if (state.resizeTimer) {
          window.clearTimeout(state.resizeTimer);
          state.resizeTimer = null;
        }
        if (state.map) {
          state.map.remove();
          state.map = null;
        }
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
